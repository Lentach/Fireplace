# Dependabot: security-focused, low-noise (solo maintainer).
# Version-update PRs are capped and grouped monthly; security updates are
# governed by repo Settings -> Code security (enable Dependabot alerts +
# security updates there — they ignore these limits and open PRs immediately).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node MUST describe the runtime, not the newest Node. The image is
      # `node:22-alpine` in BOTH stages of backend/Dockerfile, CI pins
      # node-version 22, and package.json says `engines.node >=22` — types for 24
      # or 26 would let a call to an API this runtime does not have type-check
      # green and then crash in prod. Dependabot proposed 22 -> 26 (#155, closed
      # 2026-09-08). When the base image moves, bump BOTH in the same commit and
      # drop this rule. Major only — patch/minor of the 22 line still land in the
      # backend-minor-patch group.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

      # The Nest family must move as ONE major (core/common/platform-*/websockets
      # peer each other at the same ^N), and today it CANNOT: @nestjs/throttler
      # is at 6.5.0 (latest) and still peers `@nestjs/common ^7 || ... || ^11`
      # only, so Nest 12 breaks the WsThrottlerGuard rate-limit contract
      # (CLAUDE.md §7). Dependabot's single-package attempt (#156,
      # @nestjs/platform-express 11 -> 12) also failed its own Backend tests job.
      # RE-CHECK when @nestjs/throttler ships a release peering ^12, then do the
      # whole family in one PR and delete this rule. Major only.
      - dependency-name: "@nestjs/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned in pubspec.yaml: >=0.6.1 native-assets hook needs CMake + MSVC C++
      # on the build PC; the asset ships nowhere (web=JS path, Android=NDK).
      # Version updates only — SECURITY updates for this crypto dep must still
      # open PRs (an unconditional ignore would silence CVE fixes too).
      - dependency-name: webcrypto
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

      # The Android encrypted content store (frontend/CLAUDE.md §5). Same shape
      # as webcrypto above and for the same reason: sqlite3 3.x and drift >=2.32
      # switch to native-assets build hooks that demand MSVC C++ on EVERY local
      # `flutter test`, and sqlcipher_flutter_libs 0.7.0 is the "+eol" release.
      # pubspec.yaml already carries EXPLICIT upper bounds, but dependabot
      # rewrites the constraint rather than resolving within it, so it proposed
      # all four anyway (#123, closed 2026-08-02) and would do so every month.
      # Version updates only — a SECURITY advisory on any of these still opens
      # a PR, which is the whole point of listing update-types instead of a
      # bare dependency-name.
      - dependency-name: drift
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: drift_dev
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: sqlite3
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: sqlcipher_flutter_libs
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
