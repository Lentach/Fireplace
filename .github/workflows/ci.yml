name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Least privilege: CI only reads the repo; no job needs write access.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # No dependencies needed - runs before `npm ci` so a broken impact tool fails
      # fast instead of after a full install.
      - name: Self-test scripts/impact.mjs
        working-directory: .
        run: node scripts/impact.selftest.mjs

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test 2>&1 | tee test-output.txt

      - name: Verify CLAUDE.md backend test counts
        working-directory: .
        run: node scripts/verify-claude-backend-test-counts.mjs --log backend/test-output.txt

  frontend:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test
