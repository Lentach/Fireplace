name: CI

# `paths-ignore` is duplicated per trigger on purpose: GitHub Actions does NOT
# support YAML anchors in workflow files.
#
# WHY: measured on 2026-08-18 over 188 runs / 689 jobs since Aug 1 (job
# started_at -> completed_at, rounded up per minute, GitHub's own billing rule):
# 2084 billable minutes against a 2000-minute free private-repo allowance, which
# is exactly why every job started failing in 2s with `steps: []`. 609 of those
# minutes were spent on commits that changed ONLY prose. 583 of the 609 came
# from commits touching NO CLAUDE.md at all - almost all of them session
# summaries under `.cursor/session-summaries/`.
#
# CLAUDE.md is deliberately NOT ignored. `scripts/verify-claude-*-test-counts.mjs`
# gate the test counts written in those files; skipping CI on a CLAUDE.md edit
# would let a wrong count sit unverified until the next code push. 26 minutes a
# month is a fair price for keeping that guard armed.
#
# A mixed commit (prose + code) still runs everything: `paths-ignore` only skips
# when EVERY changed path matches.
#
# CAVEAT for whoever makes this repo public: branch protection is a paid feature
# and returns 403 today, so no check here can be "required". Once the repo is
# public, protection becomes available - and if you then mark these jobs as
# required status checks, a docs-only PR will hang forever on "Expected -
# waiting for status" because a skipped workflow never reports. In that case
# replace this with the dummy-job pattern (a second workflow with inverted
# `paths` exposing the same four job names and exiting 0).
on:
  push:
    branches:
      - master
    paths-ignore:
      - '.cursor/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTEXT-MAP.md'
  pull_request:
    paths-ignore:
      - '.cursor/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTEXT-MAP.md'

# One in-flight run per ref. Pushing twice in a minute used to pay for both; now
# the superseded run is cancelled and only the tip is validated - which is the
# only commit anyone acts on anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo; no job needs write access.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # No dependencies needed - runs before `npm ci` so a broken impact tool fails
      # fast instead of after a full install.
      - name: Self-test scripts/impact.mjs
        working-directory: .
        run: node scripts/impact.selftest.mjs

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test 2>&1 | tee test-output.txt

      - name: Verify CLAUDE.md backend test counts
        working-directory: .
        run: node scripts/verify-claude-backend-test-counts.mjs --log backend/test-output.txt

      # ESLint RATCHET, not a gate. `npm run lint` has been failing on master for months
      # (966 problems / 726 errors on 2026-07-08 -> 1603 / 1320 on 2026-07-27, ~+30/day)
      # precisely because nothing ran it. A plain eslint step would be red on day one and
      # would get ignored, which is how the debt accumulated in the first place.
      #
      # So this fails ONLY when the error count goes UP against scripts/lint-baseline.json.
      # Pre-existing debt never turns the build red; new debt does. The floor drops as debt
      # is paid (`node scripts/lint-ratchet.mjs --update`).
      #
      # Note `npm run lint` is `eslint --fix` — it rewrites ~510 files instead of reporting.
      # Never "fix" a ratchet failure by running it. Use `npm run lint:check` to see the list.
      - name: Backend lint ratchet
        working-directory: .
        run: node scripts/lint-ratchet.mjs

  frontend:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      # Single run, log captured by redirect rather than `| tee` so the step's exit
      # status is Flutter's own and never depends on pipefail being set.
      - name: Run Flutter tests
        run: flutter test > test-output.txt 2>&1 || { cat test-output.txt; exit 1; }

      - name: Show Flutter test summary
        run: tail -1 test-output.txt

      - name: Verify CLAUDE.md frontend test counts
        working-directory: .
        run: node scripts/verify-claude-frontend-test-counts.mjs --log frontend/test-output.txt

  # The ONLY automated check on the origin-wide Web Lock half of the E2E fix
  # (`fd89e7e`, 0.0.126). It has to be its own job because the guard lives in
  # `navigator.locks`, which no VM test can reach:
  # `test/services/session_cross_context_lock_web_test.dart` only runs under
  # `--platform chrome` (it is honestly SKIPPED in the `frontend` job above),
  # and the two-engine race probes inject a FAKE in-memory lock. Before this
  # job, production could have stopped calling `navigator.locks` altogether and
  # every suite would still have been green — the audit found that test
  # reporting itself as PASSED while asserting nothing.
  #
  # The runner compiles `tool/session_cross_context_lock_probe.dart`, serves it,
  # and drives headless Chrome; the page reports its verdict back over HTTP.
  # It asserts same-name requests queue AND that a missing Web Locks API fails
  # closed instead of silently running a Signal mutation unlocked.
  #
  # Falsified on 2026-07-27 before being trusted: breaking the lock produced
  # `SESSION_LOCK_FAIL: same-name lock did not queue` and exit 1; a page that
  # never reports produced the hang message and exit 1.
  session-lock:
    name: E2E session Web Lock probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run the session lock probe
        run: node scripts/verify-session-lock-probe.mjs

  # The ONLY automated guard on the cross-tier wire contracts in CLAUDE.md 7:
  # the E2E envelope, WS event names/payloads, and delete semantics. Unit tests on
  # either side mock the other, and scripts/impact.mjs cannot see across the wire,
  # so nothing else proves the two halves still agree.
  #
  # CI-FAILING as of 2026-07-27 (`continue-on-error` removed). It ran advisory-only for
  # 5 consecutive runs (30290696876, 30293138856, 30293298015, 30293387936, 30294083606)
  # with the harness step green in every one, after catching two real disaster-recovery
  # bugs on its first two attempts. A wire regression now turns the CI run RED.
  #
  # RED IS NOT A GATE. Be precise about what this does and does not do: GitHub branch
  # protection is a paid feature and the API returns 403 on this private free-plan repo,
  # so nothing here can BLOCK a push or a merge. CI only reports, and only after `master`
  # has already changed — and the project explicitly allows small fixes pushed straight
  # to `master`. Treating red as a blocker is a PROJECT POLICY carried out by a human or
  # agent checking the run, not something GitHub enforces. Do not let a future reader
  # believe a merge was prevented; it was not.
  #
  # Do NOT path-filter this job: wire breakage is routinely caused by an edit OUTSIDE the
  # files you would think to list. If it turns flaky, restore `continue-on-error: true`
  # deliberately and say so in the session summary — do not silently disable it.
  e2e-wire:
    name: E2E wire harness
    runs-on: ubuntu-latest
    # Real sockets + libsignal can wedge; cap well under GitHub's multi-hour default so a
    # hung run does not burn a runner before the `if: always()` teardown gets to fire.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start backend + Postgres
        run: docker compose up -d --wait --wait-timeout 300 || docker compose up -d

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "backend healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "backend never became healthy"; docker compose logs --tail 100 backend; exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      # The opt-in §6.2 reset probe drives Postgres out of band through
      # `e2eSql`, whose container default is a developer's local compose
      # project name and is therefore WRONG on a runner. Resolve it from
      # compose itself so the coupling is explicit and correct the day that
      # probe is enabled here (it is skipped by default, so this is inert now).
      - name: Resolve the db container for the opt-in SQL channel
        run: echo "E2E_DB_CONTAINER=$(docker compose ps -q db)" >> "$GITHUB_ENV"

      # test_e2e is a sibling of test/, so the fast lane never picks it up.
      # Fresh accounts every run is BY DESIGN - see frontend/CLAUDE.md 1.
      - name: Run the wire harness
        working-directory: frontend
        run: flutter test test_e2e

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend

      - name: Tear down
        if: always()
        run: docker compose down   # no -v: CLAUDE.md 4 bans that flag; do not normalise it

  # U7. The §6.2 reset probe is the ONLY proof that a completed ceremony re-keys
  # strictly within `(identity, deviceId)` (falsification 12) and that the roster
  # teardown runs — and until now nothing ran it, so that proof existed only on a
  # developer's machine.
  #
  # IT MUST BE ITS OWN JOB WITH ITS OWN STACK. `/auth/register` is 10 per HOUR
  # per IP, the limiter is in-memory in the backend process, and every account in
  # `test_e2e/` shares that one bucket — the default run already spends it to the
  # edge (measured 2026-08-22: a third account pushed `takeover_alarm_test.dart`
  # into ThrottlerException). So this canNOT be a `--dart-define` bolted onto
  # `e2e-wire`; it needs a FRESH backend, which is what resets the bucket. Never
  # raise the production cap to fit a test.
  #
  # The ceremony is also DESTRUCTIVE — it replaces the account identity, revokes
  # every device and burns a device id forward — so it needs an account nothing
  # else depends on. A dedicated stack gives it exactly that.
  e2e-reset-probe:
    name: E2E reset teardown probe
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start backend + Postgres
        run: docker compose up -d --wait --wait-timeout 300 || docker compose up -d

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health > /dev/null 2>&1; then
              echo "backend healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "backend never became healthy"; docker compose logs --tail 100 backend; exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      # REQUIRED here, unlike in e2e-wire where it is inert: this probe ages
      # `identity_reset_requests."deadlineAt"` through `e2eSql`, whose container
      # default is a developer's local compose project name and is wrong on a
      # runner. The probe then lets the REAL per-minute completeDueResets sweep
      # authorize the replacement, which is why the delay is aged and not waited.
      - name: Resolve the db container for the SQL channel
        run: echo "E2E_DB_CONTAINER=$(docker compose ps -q db)" >> "$GITHUB_ENV"

      # The ENTIRE group is `skip:`-gated on bool.fromEnvironment('RESET_PROBE')
      # (identity_reset_teardown_test.dart:48). Drop or typo that define and
      # `flutter test` skips everything and EXITS 0 — the job would report green
      # while proving nothing, and this probe is the only automated proof that a
      # completed §6.2 reset re-keys strictly within (identity, deviceId)
      # (falsification 12). So assert a test actually PASSED.
      #
      # BOTH reporter shapes must be accepted, because they differ by
      # environment and the first version of this guard matched only the local
      # one and failed a genuinely green CI run:
      #   CI:    `🎉 2 tests passed.`
      #   local: `00:58 +2: All tests passed!`
      # A fully skipped run reports a ZERO count in either shape, which the
      # leading [1-9] rejects.
      - name: Run the reset teardown probe
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          flutter test test_e2e/identity_reset_teardown_test.dart \
            --dart-define=RESET_PROBE=true | tee probe.log
          if ! grep -Eq '(^|[^0-9])[1-9][0-9]* tests? passed|\+[1-9][0-9]*[ :].*All tests passed' probe.log; then
            echo "::error::the reset probe reported no PASSING test — the RESET_PROBE define is not taking effect, so this job proves nothing"
            exit 1
          fi

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend

      - name: Tear down
        if: always()
        run: docker compose down   # no -v: CLAUDE.md 4 bans that flag; do not normalise it
