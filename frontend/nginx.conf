server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Must stay >= the client's MediaCryptoService.maxBytes (20 MB) plus
    # multipart overhead, or an oversize video 413s mid-send after a full
    # upload. Mirrors the production host nginx.
    client_max_body_size 21m;

    # Internal location â€” ONLY reachable via X-Accel-Redirect from NestJS
    location /internal/media/ {
        internal;
        alias /app/media/;
    }

    # Media upload â€” JWT checked in NestJS
    location = /media/upload {
        proxy_pass http://backend:3000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Media serve â€” NestJS sets X-Accel-Redirect, Nginx serves from disk
    location /media/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /auth/ {
        proxy_pass http://backend:3000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /users/ {
        proxy_pass http://backend:3000/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location = /notes {
        proxy_pass http://backend:3000/notes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /note/ {
        proxy_pass http://backend:3000/note/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Landing-page contact form + owner inbox (/contact, /contact/inbox,
    # /contact/sw.js, /contact/manifest.webmanifest, /contact/subscribe) are
    # served by the standalone `fireplace-inbox` service (separate repo:
    # Lentach/fireplace-inbox), NOT this backend. On the host, nginx proxies
    # /contact -> http://127.0.0.1:3001. It is intentionally absent here because
    # that service is not part of this compose network.


    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Docker healthcheck / uptime probes â€” must not fall through to Flutter index.html
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /version {
        proxy_pass http://backend:3000/version;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

