# Dependabot: security-focused, low-noise (solo maintainer).
# Version-update PRs are capped and grouped monthly; security updates are
# governed by repo Settings -> Code security (enable Dependabot alerts +
# security updates there — they ignore these limits and open PRs immediately).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node MUST describe the runtime, not the newest Node. The image is
      # `node:22-alpine` in BOTH stages of backend/Dockerfile, CI pins
      # node-version 22, and package.json says `engines.node >=22` — types for 24
      # or 26 would let a call to an API this runtime does not have type-check
      # green and then crash in prod. Dependabot proposed 22 -> 26 (#155, closed
      # 2026-09-08). When the base image moves, bump BOTH in the same commit and
      # drop this rule. Major only — patch/minor of the 22 line still land in the
      # backend-minor-patch group.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

      # The Nest family must move as ONE major (core/common/platform-*/websockets
      # peer each other at the same ^N), and today it CANNOT: @nestjs/throttler
      # is at 6.5.0 (latest) and still peers `@nestjs/common ^7 || ... || ^11`
      # only, so Nest 12 breaks the WsThrottlerGuard rate-limit contract
      # (CLAUDE.md §7). Dependabot's single-package attempt (#156,
      # @nestjs/platform-express 11 -> 12) also failed its own Backend tests job.
      # RE-CHECK when @nestjs/throttler ships a release peering ^12, then do the
      # whole family in one PR and delete this rule. Major only.
      - dependency-name: "@nestjs/*"
        update-types:
          - version-update:semver-major

      # TypeScript 7 is out and typescript-eslint 8.70 peers `typescript <6.1.0`
      # — TS7 would silently strand every type-aware lint rule while the build
      # stays green. Drop when typescript-eslint peers ^7. Major only.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # NO `groups:` HERE ON PURPOSE (2026-09-08). It used to be
    # `frontend-minor-patch: {update-types: [minor, patch]}`, and the `ignore`
    # list below was NOT honoured inside it: #157 (2026-09-01), #169 and #171
    # (both today) each bundled drift/drift_dev/sqlite3 despite rules that have
    # been in this file since 2026-08-03, and every one of those PRs was
    # unmergeable — `flutter pub get` cannot even resolve the set. GitHub's own
    # trackers carry the same behaviour (dependabot-core #7523, discussion
    # #11962) for a group with no explicit `patterns`. Update-config-level
    # `ignore` demonstrably works for standalone PRs, so the fix is one PR per
    # package. Cost: up to 3 frontend PRs a month instead of 1 grouped one —
    # cheaper than a dead PR every month plus the re-litigation it invites.
    ignore:
      # Pinned in pubspec.yaml: >=0.6.1 native-assets hook needs CMake + MSVC C++
      # on the build PC; the asset ships nowhere (web=JS path, Android=NDK).
      # Version updates only — SECURITY updates for this crypto dep must still
      # open PRs (an unconditional ignore would silence CVE fixes too).
      - dependency-name: webcrypto
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

      # The Android encrypted content store (frontend/CLAUDE.md §5).
      # CORRECTED 2026-09-08: the reason recorded here was WRONG. It claimed
      # sqlite3 3.x / drift >=2.32 switch to native-assets build hooks that
      # demand CMake + MSVC C++ on every local `flutter test`. That did NOT
      # reproduce — the full host suite runs fine with sqlite3 3.5.2 resolved.
      # The REAL blocker is an API deletion: sqlite3 3.x removed
      # `package:sqlite3/open.dart`, which lib/services/encryption/content_db.dart
      # imports for the SQLCipher open override, so `flutter analyze` fails with
      # "Target of URI doesn't exist". Taking it means rewriting the open
      # override on the encrypted content store — a data-safety path whose only
      # honest verification surface is an on-device integration run.
      # sqlcipher_flutter_libs 0.7.0 is still the "+eol" release.
      # Version updates only — a SECURITY advisory on any of these still opens
      # a PR, which is the whole point of listing update-types instead of a
      # bare dependency-name.
      - dependency-name: drift
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: drift_dev
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: sqlite3
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: sqlcipher_flutter_libs
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

      # Both are pinned by the FLUTTER SDK, not by us — dependabot cannot see
      # that and proposed them in #157/#169/#171 anyway, where they made the
      # whole group unresolvable:
      #   clock 1.1.3        -> `flutter_test` from the SDK pins clock 1.1.2.
      #   build_runner 2.16+ -> wants analyzer >=13.3.0 (needs meta ^1.18.3 vs
      #                         the SDK's meta 1.18.0) AND is capped by
      #                         drift_dev 2.31.0's analyzer <11.0.0, so it
      #                         cannot move until the drift/sqlite3 block above
      #                         is unblocked.
      # Re-check both after a Flutter SDK upgrade; delete these two entries
      # then. Version updates only, same as the rest of this list.
      - dependency-name: clock
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: build_runner
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
